<!-- sign-in (same saved key as /admin) -->
<div id="login" class="login" hidden>
  <form class="login-card card" id="loginForm" autocomplete="off">
    <div class="brand-tile big">B</div>
    <h1 class="serif">BoJioVenue</h1>
    <p class="mono label">BUSINESS DASHBOARD</p>
    <p class="muted" id="loginMsg">Enter your admin key to continue.</p>
    <input id="loginKey" type="password" placeholder="Admin key" aria-label="Admin key" autocomplete="current-password">
    <button class="btn primary block" type="submit">Open dashboard</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside id="side" class="side" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main-wrap">
    <header class="top" id="top"></header>
    <main id="main" class="main" tabindex="-1" aria-live="polite"></main>
  </div>
</div>

<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip"></div>
